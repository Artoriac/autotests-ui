# pytest.ini
[pytest]
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    regression: Маркировка для регрессионных тестов.
    integration: Маркировка для тестов, связанных с регистрацией пользователей.
    ui: Маркировка для UI-тестов.
    slow: Маркировка для медленных тестов.
    smoke: маркировка для smoke-тестов.
    registration: Маркировка для тестов, связанных с регистрацией пользователей.
    critical: Маркировка для критических тестов.
    authorization: Маркировка для тестов, связанных с аутентификацией.
    courses: маркировка для тестов, связанных с курсом.